# agents.conf: how the admission hook names the client behind each request. The name shows in
# Wanda's Traffic view and the ADMIT log; it doesn't change routing. Deployed to ~/.litellm/ and
# re-read when it changes.
#
# Sections are checked top to bottom; the first agent section that matches names the request, no
# match = "other". A section with `tag = yes` is a label added to whatever agent matched
# ("claude-code+unreal"); every matching tag is added.
#
# To add a client: send one request through it, read its `ua` (User-Agent) and tool count in
# Wanda's ADMIT log, and add a section. Any one matching key is enough:
#   ua          substrings of the User-Agent (case-insensitive)
#   ua_prefix   the User-Agent starts with one of these (case-insensitive)
#   header      a request header that is present: name, or name=substring of its value
#   tools_any   tool name patterns (globs, case-insensitive); one present is enough
#   tools_all   tool names that must all be present (exact case)
# Lists are comma-separated. Comments go on their own lines.

[claude-code]
ua = claude-cli, claude-code
header = x-claude-code-session-id

[codex]
ua = codex

[opencode]
ua = opencode

[hermes]
ua = hermes
tools_any = browser_vault*, skill_view, delegate_task

[pi]
ua = pi-coding-agent
ua_prefix = pi
tools_all = read, bash, edit, write

# VS Code agents send OpenRouter-style attribution headers. Check yours in the ADMIT log.
[cline]
header = x-title=cline

[roo-code]
header = x-title=roo

[kilo-code]
header = x-title=kilo

# Last resort: scripts and agents that only show their SDK.
[openai-sdk]
ua_prefix = openai/

[anthropic-sdk]
ua_prefix = anthropic/

# Tags. Example: an agent driving Unreal Editor through an MCP server.
[unreal]
tag = yes
tools_any = *monolith*, *unreal*, *vibeue*, *execute_python*
