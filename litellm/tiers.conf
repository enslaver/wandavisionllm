# tiers.conf: the local model tiers, all in one place.
#
# Each [section] below [routing] is one tier: a model server that llama-swap starts on demand
# (its script in mtplx/bin/) and LiteLLM serves as ultron/<tier>. List them biggest first; Wanda
# shows them in this order. Add, rename or drop tiers here and run ./deploy.py push: deploy.py
# rebuilds the tier parts of llama-swap/config.yaml and litellm/config.yaml from this file, and
# the hooks and Wanda read it from ~/.litellm/tiers.conf. Which model a tier runs is in its script.
#
# The example tiers are named after Claude's models so Claude Code works unmodified: it asks for
# claude-fable-*, claude-opus-*, claude-sonnet-*, claude-haiku-* and gets the local tier of that name.
#
# Comments go on their own lines (a # after a value is read as part of the value).

[routing]
# Model ids no tier claims (see match) go to this tier.
default = sonnet
# Which tiers may be loaded at the same time, in llama-swap's matrix syntax: & = together,
# | = one or the other, parentheses group. When a load wouldn't fit, the admission hook sends new
# conversations to the cloud overflow instead of making llama-swap swap. Ready-made lines for the
# example models (details: docs/hardware.md, "Ready-made settings by RAM"; below 64 GB, also
# delete the [fable] and [judge] sections and make [sonnet] unload: ttl = 600, preload = no):
#   16-24 GB:  opus | sonnet | haiku                    one tier at a time
#   32-48 GB:  (opus | sonnet) & haiku                  the big two take turns, haiku stays
#   64 GB+:    (fable | opus | judge) & sonnet & haiku  fable, opus and the image judge take turns,
#                                                       sonnet and haiku stay
resident = (fable | opus | judge) & sonnet & haiku
# Tier that answers when the requested tier can't see images (vision = no). Default: the first
# tier with vision. A small tier with a vision forge is the better choice when you have one: on a
# 16-image check, a 4B haiku forge got 15/16 right at 1.6 s each, the 9B sonnet 10/16 at 21 s (it
# overthinks images). See mtplx/bin/tier-haiku.sh.
vision = sonnet
# Small, always-loaded tier for quick yes/no checks (the media hook asks it before acting on an
# agent's request). Default: the last tier.
helper = haiku

# Keys for a tier (all optional; defaults in parentheses):
#   script          its start script in mtplx/bin/ (tier-<name>.sh); llama-swap runs it with the
#                   port, and TIER=<name> in the environment
#   ttl             seconds idle before llama-swap unloads it; 0 = never (600)
#   preload         load when llama-swap starts (no)
#   evict_cost      how much unloading it hurts; llama-swap evicts the cheapest set first (1)
#   context         max_input_tokens LiteLLM advertises and enforces (131072)
#   vision          the model sees images; no = images go to [routing] vision (yes)
#   chat_only       the server has no /v1/responses, so LiteLLM converts those calls to chat (no)
#   think_in_content
#                   the chat template reads earlier reasoning back from a leading <think> block in
#                   assistant content (Qwen3.5 does). LiteLLM drops reasoning_content on the way to
#                   a local server, so the admission hook puts it there (no)
#   timeout         seconds LiteLLM waits for a request, and for the first streamed token; a timed-out
#                   request is not retried, since the local server keeps working on it and a retry
#                   would queue behind it. Raise it for tiers whose long prompts take minutes to
#                   prefill (LiteLLM's default: 600, retried)
#   upstream_model  model name llama-swap sends to the server instead of the tier name, for servers
#                   that answer to one fixed name (mlx_lm.server: default_model) or load whatever
#                   path the request names (mlx_vlm.server); ~/ = your home directory (none)
#   max_waiting     queued requests a NEW conversation may join before it overflows; cloud overflow
#                   is the last resort, so this is deep (20)
#   substitute      a loaded tier to use instead when this one would need a load
#   match           model id patterns (globs) that pick this tier; the most specific one wins
#   advertise       extra model ids listed in /v1/models for this tier
#   cloud           overflow model id at OMNIROUTE_BASE (any OpenAI-compatible endpoint);
#                   empty = this tier never overflows. Examples use OpenRouter ids; on OmniRoute
#                   use a combo name, on another LiteLLM any model it serves.
#   color           Wanda's color for it
#   routed          no = not a tier but a helper model llama-swap serves next to them (the image
#                   judge): clients ask for it by name only (ultron/<name>), it never takes or
#                   overflows a conversation, and every tier may unload it. match, advertise,
#                   cloud and substitute aren't allowed with it (yes)

[fable]
# Dense 27B for the hardest problems. Started by tier-fable.sh (TensorFold).
ttl = 600
evict_cost = 3
# Input cap: TensorFold's window is 262,144 for prompt + reply; 200k leaves 32k+ for thinking + answer.
context = 200000
# A cold 200k prefill takes 7-14 minutes.
timeout = 1800
vision = no
chat_only = yes
match = claude-fable-*
advertise = claude-fable-5-1
cloud = anthropic/claude-fable-5.1
color = #ebcb8b

[opus]
# Big MoE (3B active): heavy coding, long context, fast. Started by tier-opus.sh (mtplx).
ttl = 600
evict_cost = 3
context = 256000
timeout = 1800
vision = no
chat_only = yes
think_in_content = yes
match = claude-opus-*
advertise = claude-opus-5-5
cloud = anthropic/claude-opus-5.5
color = #c39bd3

[sonnet]
# Everyday coding and tool calling. Started by tier-sonnet.sh (mtplx). Always loaded on 64 GB+
# (in every resident set); below that, ttl = 600 and preload = no.
ttl = 0
preload = yes
evict_cost = 5
context = 256000
timeout = 1800
think_in_content = yes
substitute = opus
match = claude-sonnet-*, claude-*
advertise = claude-sonnet-5
cloud = anthropic/claude-sonnet-5.5
color = #88c0d0

[haiku]
# Small and fast: titles, quick tool calls, the media hook's yes/no checks. Always loaded.
ttl = 0
preload = yes
# The example pack is text only; images go to [routing] vision.
vision = no
evict_cost = 5
context = 256000
max_waiting = 50
think_in_content = yes
substitute = sonnet
match = claude-haiku-*
advertise = claude-haiku-4-5
cloud = anthropic/claude-haiku-4.5
color = #a3be8c

[judge]
# Image judge for Vision/judge/rank.py: SkyJM-Gen-4B picks the better of two generated images for a
# prompt. Not a tier (routed = no): asked for by name only, as ultron/judge. ~5.7 GB, so it takes
# the big tier's place in resident and unloads two minutes after a ranking run. Started by
# tier-judge.sh (mlx_vlm.server). Delete this section if you don't rank images.
routed = no
ttl = 120
evict_cost = 1
# Two ~1 MP images plus the rubric prompt is ~3k tokens.
context = 32000
chat_only = yes
# mlx_vlm.server loads whatever path the request names: the same path as MODEL in tier-judge.sh.
upstream_model = ~/models/SkyJM-Gen-4B-mlx-8bit
color = #d08770
