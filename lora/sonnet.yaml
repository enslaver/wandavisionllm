# mlx_lm.lora config — QLoRA on the sonnet tier's model: Swift 1.5 Qwen3.8-27B (ukisai).
#   ./prep_swift_base.sh                      # once: BF16 download (55 GB) -> 4-bit MLX base (~15 GB)
#   ~/lora/.venv/bin/python train.py --config sonnet.yaml --model ~/lora/base/sonnet-swift-1.5-27b-4bit \
#     --data ~/lora/data/v1 --adapter-path ~/lora/runs/v1 [--iters N]
# The tier serves a GGUF (IQ3_XXS + MTP head) on Splash, which has no adapter flag, so this trains on the BF16
# checkpoint requantized to 4-bit MLX. The base is NOT the served file: see README "Sonnet on Swift" for how
# an adapter gets back into the tier. Text only, like the tier (--language-only).
# Memory: 4-bit weights ~15 GB + activations at 8k tokens: unload opus first.
# Paths come from the command line: mlx_lm doesn't expand ~ in this file.
# The Qwen3.5-9B config for the mtplx sonnet alternate is sonnet-qwen35-9b.yaml.
train: true
fine_tune_type: lora

max_seq_length: 8192          # make_dataset.py prompts are 5.7-6.9k tokens + one turn
mask_prompt: true             # loss on the chosen turn only (its <think> and tool call)

optimizer: adamw
batch_size: 1
grad_accumulation_steps: 4
iters: 150
learning_rate: 1e-5           # 27B: half the 9B's 2e-5
seed: 0
grad_checkpoint: true

num_layers: 24                # top 24 of 64 blocks: bounds optimizer and activation memory on a 64 GB box
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

val_batches: -1
steps_per_eval: 25
steps_per_report: 5
save_every: 50
