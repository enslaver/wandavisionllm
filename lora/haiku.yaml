# mlx_lm.lora config — QLoRA on the served haiku weights (Qwen3.5-4B, 4-bit g64), text only.
#   TIER=haiku lora/run.sh haiku-v1 [train.py flags]
# For agent-recovery rounds like sonnet's. Image training doesn't go through here: train on the GPU box
# with Unsloth (unsloth_vision.py) and forge the merge (README, The haiku tier).
# model: text-only view of the MTPLX pack (symlinks, see README); vision tower and MTP head stay as they are.
# Paths come from the command line: mlx_lm doesn't expand ~ in this file.
train: true
fine_tune_type: lora

max_seq_length: 8192          # make_dataset.py prompts are 5.7-6.9k tokens + one turn
mask_prompt: true             # loss on the chosen turn only (its <think> and tool call)

optimizer: adamw
batch_size: 1
grad_accumulation_steps: 4
iters: 200                    # ~80 examples -> ~2.5 epochs at an effective batch of 4
learning_rate: 2e-5
seed: 0
grad_checkpoint: true

num_layers: -1                # all 32 blocks
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

val_batches: -1
steps_per_eval: 25
steps_per_report: 5
save_every: 50
