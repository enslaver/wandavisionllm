name: Release

# Push a tag like v0.2.0 whose version has a "## [0.2.0]" section in CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - name: Test before publishing
        run: |
          python -m pytest litellm -q -p no:cacheprovider
          python scripts/check_repo.py
      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $V"; exit 1; fi
          grep -q "^version = \"$V\"" pyproject.toml || { echo "pyproject.toml version is not $V"; exit 1; }
      - name: Source archive
        run: git archive --format=tar.gz --prefix="wandavision-${GITHUB_REF_NAME}/" -o "wandavision-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "wandavision-${GITHUB_REF_NAME}.tar.gz" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
